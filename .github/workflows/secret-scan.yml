name: secret-scan

# pull_request_target carga este workflow desde la rama base protegida. El
# contenido del PR se obtiene solo como objetos Git para diff/show: nunca se
# ejecuta el scanner ni se carga la lista desde HEAD.
on:
  pull_request_target:
    # Sin filtro `branches`: el gate de integración de claude-skills
    # (verify-integration) solo acepta `types` en pull_request_target, y
    # además así los PRs de cadenas apiladas (base distinta de master)
    # también se escanean -- con `branches: [master]` esos PRs entraban
    # sin pasar por el scanner.
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  trusted-scan:
    runs-on: ubuntu-latest
    # El límite de 100k KDF es deliberado y se escanea completo. Reserva margen
    # para runners compartidos: cortar a 25 min convertía ese límite válido en
    # un falso fallo de disponibilidad.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Registrar estado pendiente en el HEAD exacto
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending -f context=scan \
            -f description='Escaneo confiable en curso' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Escanear con código y lista de la base exacta
        id: scan
        env:
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          DIFF_BASE=$(git merge-base "$TRUSTED_SHA" "$HEAD_SHA")
          test -n "$DIFF_BASE"
          python3 ops/ci/scan-pr-secrets.py "$DIFF_BASE" "$HEAD_SHA"

      - name: Publicar resultado exacto en el HEAD
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          PENDING_OUTCOME: ${{ steps.pending.outcome }}
        run: |
          set -euo pipefail
          STATE=failure
          if [ "$SCAN_OUTCOME" = success ] && [ "$PENDING_OUTCOME" = success ]; then
            read -r CURRENT_HEAD CURRENT_BASE < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha + " " + .base.sha')
            if [ "$CURRENT_HEAD" = "$HEAD_SHA" ] && [ "$CURRENT_BASE" = "$BASE_SHA" ]; then
              STATE=success
            fi
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$STATE" -f context=scan \
            -f description='Escaneo de secretos desde base confiable' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
