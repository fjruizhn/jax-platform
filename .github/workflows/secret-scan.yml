name: secret-scan

# pull_request_target carga este workflow desde la rama base protegida. El
# contenido del PR se obtiene solo como objetos Git para diff/show: nunca se
# ejecuta el scanner ni se carga la lista desde HEAD.
on:
  pull_request_target:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  trusted-scan:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Escanear con código y lista de la base exacta
        env:
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          DIFF_BASE=$(git merge-base "$TRUSTED_SHA" "$HEAD_SHA")
          test -n "$DIFF_BASE"
          python3 ops/ci/scan-pr-secrets.py "$DIFF_BASE" "$HEAD_SHA"

  scanner-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probar el scanner propuesto
        run: |
          set -euo pipefail
          python3 -m venv /tmp/jax-secret-scan-test-venv
          /tmp/jax-secret-scan-test-venv/bin/python -m pip install pytest==8.4.2
          /tmp/jax-secret-scan-test-venv/bin/python -m pytest ops/ci/test_scan_pr_secrets.py -q
