name: secret-scan-tests

# Estas pruebas son informativas: corren código del PR sin secretos ni permisos
# de escritura. La única decisión de seguridad es el job `scan` de
# secret-scan.yml, cargado desde la base por pull_request_target.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  scanner-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probar el scanner propuesto
        run: |
          set -euo pipefail
          python3 -m venv /tmp/jax-secret-scan-test-venv
          /tmp/jax-secret-scan-test-venv/bin/python -m pip install pytest==8.4.2
          /tmp/jax-secret-scan-test-venv/bin/python -m pytest ops/ci/test_scan_pr_secrets.py -q
