  no-fail-open-except:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/test_no_fail_open_except.py -v

  # La opcion B del diseno 2026-08-28 (probe_facet deja de escribir
  # probe_error) depende de que _invoke_facet sea un envoltorio total:
  # cuando lanza, YA registro. Sin este job esa propiedad seria tacita, y
  # una garantia tacita es peor que la duplicacion que reemplaza -- cuando
  # se rompe, no avisa. El test se auto-verifica por MUTACION, clasificada
  # por familia de ataque -- la taxonomia vive en el docstring del propio
  # archivo, que es donde se puede verificar. A proposito NO se repite aca el
  # numero de mutaciones: es una consecuencia, no una medida, y un conteo en
  # un comentario de YAML no lo verifica nadie (ya estuvo mal dos veces).
  invoke-facet-envoltorio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/test_policy_invoke_facet_envoltorio.py -v

  # --------------------------------------------------------------------------
  # Suite del backend, modo "CON base de datos" -- los 150 tests que el job de
  # abajo saltea.
  #
  # POR QUE EXISTE (2026-09-01). Hasta hoy CI corria 158 tests y salteaba 151:
  # el 68% de la suite no se ejecutaba en ningun lado automatico, y DEUDA.md lo
  # daba por irrecuperable ("el numero no es estable: 10 o 12 failures sobre el
  # mismo arbol limpio"). Esa premisa estaba VENCIDA. Medido el 2026-09-01
  # contra master 461a089: 5 failures + 1 error, los MISMOS por nombre en 3
  # corridas seguidas -- deterministico, no inestable.
  #
  # Y las 6 salian de UNA causa: `db/connection.py` guardaba UN pool global
  # para todos los event loops. Un pool de aiomysql queda atado al loop que lo
  # creo, y en la suite hay dos (el portal de TestClient y el de
  # pytest-asyncio). Arreglado ahi -- ver el comentario del modulo. Con eso:
  # 308 passed / 1 skipped / 0 failed / 0 errors, identico en 5 corridas.
  #
  # ESQUEMA DE JACOBS. `jacobs_pipelines` la crea `jacobs/store.py::init_tables()`
  # en el repo `jax`; jax-platform la LEE (api/pipelines.py,
  # jax_engine/owner_cleanup.py) y nunca la crea. En la DB de desarrollo existe
  # porque Jacobs la creo alguna vez; en un runner limpio no, y sin ella caen
  # los 14 tests de propiedad de pipeline -- justo los que cubren el IDOR
  # cerrado en agosto. Este job clona `jax` y ejecuta SU init_tables(), en vez
  # de copiar el DDL: una copia del esquema seria una segunda fuente de verdad
  # que se desincroniza sola, que es el defecto que este codebase viene
  # cerrando (capabilities, motor.model_ref, facet_resolver).
  #
  # VERIFICADO CONTRA UNA BASE VIRGEN, no contra la DB de Fernando: mariadb:11.8
  # recien creado, 0 tablas, secuencia completa -> 308 passed. Ese experimento
  # ademas destapo un bug real de producto que la DB de desarrollo escondia
  # (provider.base_url de ollama sin /v1 en toda instalacion nueva), arreglado
  # en db/migrations.py en este mismo PR.
  backend-tests-con-db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: jax_memory_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JAX_JWT_SECRET: ci-dummy-not-a-real-secret
      JAX_DB_HOST: 127.0.0.1
      JAX_DB_PORT: "3306"
      JAX_DB_USER: root
      JAX_DB_PASSWORD: ci
      # tests/conftest.py fuerza JAX_DB_NAME=jax_memory_test igual; se declara
      # aca tambien para que el paso del esquema de Jacobs (que no pasa por
      # conftest) apunte a la misma base y no a `jax_memory`.
      JAX_DB_NAME: jax_memory_test
      # api/chat.py lee el config.toml del repo `jax`. Por default lo busca en
      # ~/jax/config/config.toml, que existe en hall9000 y no en un runner --
      # 30 tests caian con FileNotFoundError hasta que se hizo configurable.
      # Apunta al clon que hace el paso de mas abajo.
      JAX_CONFIG_PATH: /tmp/jax/config/config.toml
      # shadow_validation.py importa policy/governance/ del repo `jax` por
      # sys.path. Mismo caso que JAX_CONFIG_PATH: sin esto son 9 tests con
      # "ModuleNotFoundError: No module named 'claims'".
      JAX_REPO_PATH: /tmp/jax
      # Credenciales FICTICIAS, a proposito. `_query_facet` resuelve la
      # credencial del proveedor para todo transport que no sea ollama o
      # subprocess; sin ninguna, 12 tests reciben "sin binding activo
      # configurado" -- un mensaje que ademas MIENTE sobre la causa (el binding
      # existe; lo que falta es la credencial). Los tests stubean la llamada
      # HTTP, asi que el valor no se usa nunca: solo tiene que existir. Este job
      # NO debe necesitar ningun secret real del repo.
      OPENAI_API_KEY: ci-dummy-not-a-real-key
      DEEPSEEK_API_KEY: ci-dummy-not-a-real-key
      GEMINI_API_KEY: ci-dummy-not-a-real-key
      KIMI_API_KEY: ci-dummy-not-a-real-key
      ZAI_API_KEY: ci-dummy-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.14 = la version real de backend/.venv, la que corre en produccion.
          python-version: "3.14"
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Traer el repo jax (fuente de verdad del esquema de Jacobs)
        working-directory: .
        run: git clone --depth=1 https://github.com/fjruizhn/Jax.git /tmp/jax

      - name: Crear el esquema de Jacobs con SU propio init_tables()
        working-directory: .
        # pydantic ademas de aiomysql: jacobs.store importa jacobs.models.
        run: |
          pip install aiomysql pydantic
          PYTHONPATH=/tmp/jax python -c "import asyncio; from jacobs import store; asyncio.run(store.init_tables())"

      - name: Suite backend (con DB)
        run: python -m pytest -q -rs --junitxml=junit-db.xml

      - name: Piso -- que "verde" no signifique "se salteo todo"
        # Dos exigencias, no una: el piso de passed, y que el numero de SKIPS
        # siga siendo 1. Sin lo segundo, una DB que no arranca convertiria los
        # 150 tests en skips y el job seguiria verde con el piso del otro modo.
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          root = ET.parse("junit-db.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          total = sum(int(s.get("tests", 0)) for s in suites)
          fail = sum(int(s.get("failures", 0)) for s in suites)
          err = sum(int(s.get("errors", 0)) for s in suites)
          skip = sum(int(s.get("skipped", 0)) for s in suites)
          passed = total - fail - err - skip

          # MEDIDO EN ESTE JOB, no en otro entorno: 309 colectados, 308 passed,
          # 1 skipped, 0 failed, 0 errors (corrida real del 2026-09-01).
          #
          # El piso es EXACTO a proposito. La primera version puso 306 porque la
          # reproduccion local corria en un contenedor como root, y como root se
          # saltan solos los dos tests de test_facet_resolver_seal.py que
          # dependen de que un permiso bloquee (a root no lo bloquea nada). El
          # runner de GitHub corre como `runner`, no como root, asi que esos dos
          # SI corren aca. Dejar 306 habria dejado 2 tests de holgura: espacio
          # para perder tests sin que nadie se entere, que es exactamente el
          # agujero que este trabajo vino a cerrar.
          #
          # Si algun dia este job pasara a correr como root, el piso se pondria
          # rojo. Eso es lo correcto: un rojo que se investiga, no un verde que
          # esconde.
          #
          # El unico skip permitido es de dato: gpt-5.6-terra no existe en una
          # DB nueva.
          # Subido de 308 a 320 (2026-09-01): los 12 tests de
          # tests/test_policy_background_tasks.py. Medido con la DB de
          # desarrollo antes/despues (308 -> 320), skip count sin cambios (1).
          # Subido de 320 a 336 (2026-09-01): los 16 tests de
          # tests/test_policy_db_fail_closed.py. Medido con la DB de desarrollo
          # antes/despues (320 -> 336), skip count sin cambios (1).
          # Subido de 336 a 340 (2026-09-01): los 4 tests de
          # tests/test_chat_contract_prompt.py. Medido con la DB de desarrollo
          # antes/despues (336 -> 340), skip count sin cambios (1).
          # Subido de 340 a 361 (2026-09-03, SP3 grounding, incluye la ronda 2
          # del clamp por bytes de `detail`): 16 tests en
          # tests/test_shadow_validation_grounding.py (contando los 4
          # parametrizados) + 2 en tests/test_chat_grounding_wiring.py + 3 en
          # tests/test_chat_contract_prompt.py = 21. Medido con la DB de
          # desarrollo antes/despues (340 -> 361), skip count sin cambios (1).
          # Subido de 361 a 365 (2026-09-03, revalidacion por mtime del contexto
          # de gobernanza): 4 tests en
          # tests/test_grounding_config_revalidation.py -- 3 puros y 1 que pide
          # `client`. Medido con la DB de desarrollo antes/despues (361 -> 365),
          # skip count sin cambios (1).
          #
          # Subido de 365 a 372 (2026-09-03, partir PROVENANCE_MISMATCH en
          # POINTER_MISMATCH / FACT_NOT_IN_SNAPSHOT -- lado jax-platform del
          # cambio de jax commit 4617df6). Medido con
          # JAX_REPO_PATH=<worktree de jax con el cambio> .venv/bin/python -m
          # pytest -q -rs contra la DB de desarrollo, antes/despues: 357
          # passed / 8 failed / 1 skipped (366 colectados) -> 372 passed / 0
          # failed / 1 skipped (373 colectados). Los 8 que fallaban ANTES de
          # este cambio son 5 aserciones (una parametrizada x4) de
          # test_shadow_validation_grounding.py que TODAVIA esperaban el
          # status viejo PROVENANCE_MISMATCH contra un jax que, con el
          # JAX_REPO_PATH de la rama, ya solo emite los dos nuevos --
          # arreglar el lado jax-platform (persistir contract_raw + la
          # migracion de reclasificacion) las actualiza y las pone en verde,
          # sin agregar tests por si solo. +7 tests nuevos de este cambio: en
          # tests/test_shadow_validation_grounding.py, 1 (columna
          # contract_raw), 2 (POINTER_MISMATCH y FACT_NOT_IN_SNAPSHOT de
          # punta a punta contra la DB, ademas de los 5 casos existentes
          # reclasificados in-place) y 2 (contract_raw persistido +
          # truncado por bytes) = 5; en
          # tests/test_reclassify_provenance_mismatch.py (archivo nuevo), 2
          # (reclasifica las dos clases + segunda corrida no-op). 357+8+7=372.
          # Skip count sin cambios (1: gpt-5.6-terra).
          #
          # Subido de 372 a 379 (2026-09-03, columna de ORIGEN declarada por
          # quien llama): tests/test_shadow_origin.py, archivo nuevo, agrega 7
          # tests -- persistencia de `origin` (default 'unattributed' cuando
          # el cuerpo no lo declara, NUNCA 'web'; 'probe' cuando se declara),
          # 422 con cero fila fuera del vocabulario cerrado, el sexto
