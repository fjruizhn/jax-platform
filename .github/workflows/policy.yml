  # guardado con recarga fallida, banner corrupto en una frase i18n, aviso de
  # cifrado "none", códigos nuevos en es y en). Fix wave 2 (2026-09-13): sin
  # cambio en el conteo, 96 medido (solo se amplió la lista de códigos de un
  # test existente con smtp_usuario_no_ascii); 97 desde el 2026-09-13 (item F:
  # src/lightModeOverrides.test.js exige override de modo claro para cada
