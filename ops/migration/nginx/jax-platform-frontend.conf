# NO activa por defecto (2026-08-15): axioma-ia.io se sirve desde la VM dev
# (aaPanel, /www/server/panel/vhost/nginx/axioma-ia.io.conf), no desde hall9000
# — ver CLAUDE.md del proyecto, sección "Lecciones operativas #1/1-bis". Este
# puerto (:5173) en hall9000 es el server de desarrollo (vite dev, con
# hot-reload) y así quedó restaurado. Config guardada acá por si en algún
# momento se decide reemplazar vite dev por un build estático real en :5173.
server {
    listen 5173;
    server_name axioma-ia.io www.axioma-ia.io _;

    root /home/fruiz/jax-platform/frontend/dist;
    index index.html;

    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
