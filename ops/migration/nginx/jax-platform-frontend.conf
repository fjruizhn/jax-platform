# Reference only. frontend_release.py renders configured SHA and paths.
# nginx.org/r/try_files and nginx.org/r/proxy_pass preserve static/proxy semantics.
worker_processes 1;
pid /run/jax-platform-frontend-nginx/nginx.pid;
error_log /dev/stderr notice;
events { worker_connections 128; }
http {
 map $http_upgrade $connection_upgrade { default upgrade; '' close; }
 server {
  listen 5173;
  server_name axioma-ia.io www.axioma-ia.io localhost 127.0.0.1 ::1;
  root /srv/jax-platform-frontend/current/dist;
  client_max_body_size 0;
  location ^~ /api { proxy_pass http://127.0.0.1:8080; proxy_http_version 1.1; proxy_set_header Host localhost; proxy_set_header Origin $http_origin; proxy_request_buffering off; proxy_buffering off; }
  location ^~ /ws { proxy_pass http://127.0.0.1:8080; proxy_http_version 1.1; proxy_set_header Host localhost; proxy_set_header Origin $http_origin; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_request_buffering off; proxy_buffering off; }
  location ^~ /assets/ { root /srv/jax-platform-frontend; try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-JAX-Frontend-SHA "RENDERED_RELEASE_SHA" always; }
  location = /index.html { try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header X-JAX-Frontend-SHA "RENDERED_RELEASE_SHA" always; }
  location ~* ^/(?:.*\.(?:js|css|map|json|png|jpg|svg|woff2?)|(?:src|node_modules)/) { return 404; }
  location ~ /\. { return 404; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache" always; add_header X-JAX-Frontend-SHA "RENDERED_RELEASE_SHA" always; }
 }
}
