# Reference only: generated by ops/frontend/nginx_config.py.render.
# Example SHA aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa; use the validated release staging CLI for operational config.
worker_processes 1;
pid /run/jax-platform-frontend-nginx/nginx.pid;
error_log /dev/stderr notice;
events { worker_connections 128; }
http {
  types {
    text/html html htm;
    text/css css;
    application/javascript js mjs;
    application/json json map;
    image/svg+xml svg;
    image/png png; image/jpeg jpg jpeg; image/gif gif;
    image/webp webp; image/x-icon ico; image/avif avif;
    font/woff woff; font/woff2 woff2; font/ttf ttf;
    text/plain txt; application/pdf pdf; application/wasm wasm;
  }
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /run/jax-platform-frontend-nginx/client-body;
  proxy_temp_path /run/jax-platform-frontend-nginx/proxy;
  fastcgi_temp_path /run/jax-platform-frontend-nginx/fastcgi;
  uwsgi_temp_path /run/jax-platform-frontend-nginx/uwsgi;
  scgi_temp_path /run/jax-platform-frontend-nginx/scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $host $allowed_host {
    default 0;
    "~^(?:localhost|(?:[a-z0-9-]+\.)+localhost|axioma\-ia\.io|www\.axioma\-ia\.io|(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|\[(?:(?:[0-9a-f]{1,4}:){7}[0-9a-f]{1,4}|(?:[0-9a-f]{1,4}:){1,7}:|:(?:(?::[0-9a-f]{1,4}){1,7}|:)|(?:[0-9a-f]{1,4}:){6}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|::(?:[0-9a-f]{1,4}:){0,5}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|(?:[0-9a-f]{1,4}:){1,6}(?::[0-9a-f]{1,4}){1,1}|(?:[0-9a-f]{1,4}:){1,5}(?::[0-9a-f]{1,4}){1,2}|(?:[0-9a-f]{1,4}:){1,4}(?::[0-9a-f]{1,4}){1,3}|(?:[0-9a-f]{1,4}:){1,3}(?::[0-9a-f]{1,4}){1,4}|(?:[0-9a-f]{1,4}:){1,2}(?::[0-9a-f]{1,4}){1,5}|(?:[0-9a-f]{1,4}:){1,1}(?::[0-9a-f]{1,4}){1,6}|(?:[0-9a-f]{1,4}:){1,5}:(?:[0-9a-f]{1,4}:){0}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|(?:[0-9a-f]{1,4}:){1,4}:(?:[0-9a-f]{1,4}:){1}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|(?:[0-9a-f]{1,4}:){1,3}:(?:[0-9a-f]{1,4}:){2}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|(?:[0-9a-f]{1,4}:){1,2}:(?:[0-9a-f]{1,4}:){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|(?:[0-9a-f]{1,4}:){1,1}:(?:[0-9a-f]{1,4}:){4}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3})\])$" 1;
  }
  map $uri $hashed_asset {
    default 0;
    "~^/assets/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_.-]+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$" 1;
  }
  server {
    listen 0.0.0.0:5173;
    server_name _;
    if ($allowed_host = 0) { return 403; }
    if ($uri ~ "(?:^|/)\.|^/(?:src|node_modules)(?:/|$)|^/(?:package(?:-lock)?\.json|vite\.config\.[^/]+)$") { return 404; }
    root /srv/jax-platform-frontend/current/dist;
    disable_symlinks on from=/srv/jax-platform-frontend/current/dist;
    client_max_body_size 0;
    location ^~ /api {
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header Host localhost:8080;
      proxy_set_header Origin $http_origin;
      proxy_request_buffering off;
      proxy_buffering off;
    }
    location ^~ /ws {
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header Host localhost:8080;
      proxy_set_header Origin $http_origin;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
    location ^~ /assets/ {
      if ($hashed_asset = 0) { return 404; }
      root /srv/jax-platform-frontend/pool;
      disable_symlinks on from=/srv/jax-platform-frontend;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-JAX-Frontend-SHA "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa";
    }
    location ~* \.[a-z0-9]+$ { try_files $uri =404; add_header Cache-Control "no-cache"; add_header X-JAX-Frontend-SHA "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"; }
    location = /index.html { try_files /index.html =404; add_header Cache-Control "no-cache"; add_header X-JAX-Frontend-SHA "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; add_header X-JAX-Frontend-SHA "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"; }
  }
}
