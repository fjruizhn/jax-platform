# Template only.  Install on the public aaPanel ingress only after the release
# gates in docs/runbooks/virtualoffice-public-ingress.md pass.  It intentionally
# does not include a catch-all `default_server`: that owner must be inspected in
# the live aaPanel configuration so unrelated hosts are never captured.

upstream virtualoffice_jax_api {
    # The public ingress reaches JAX Platform over the private network.
    server 172.16.20.5:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name virtualoffice.axioma-ia.io;
    return 301 https://virtualoffice.axioma-ia.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name virtualoffice.axioma-ia.io;

    ssl_certificate     /www/server/panel/vhost/cert/axioma-ia.io/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/axioma-ia.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # `current` is an operator-controlled symlink to a verified immutable
    # release directory.  Do not point it at a Git checkout or Vite dev server.
    root /www/wwwroot/virtualoffice.axioma-ia.io/current/dist;
    index index.html;
    access_log /www/wwwlogs/virtualoffice.axioma-ia.io.log;
    error_log  /www/wwwlogs/virtualoffice.axioma-ia.io.error.log warn;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    # Deliberately no includeSubDomains: their deployment/ownership is separate.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Every proxied request preserves the public host and the original client
    # address.  JAX's trusted-proxy configuration must independently trust this
    # ingress address before it consumes these fields.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Browser auth contract: explicit routes only.  Keep this list synchronized
    # with backend/api/auth.py and the Office frontend.  In particular, do not
    # expose admin, keys, classic project, chat, pipeline, or websocket routes.
    location = /api/auth/login { proxy_pass http://virtualoffice_jax_api; }
    location = /api/auth/refresh { proxy_pass http://virtualoffice_jax_api; }
    location = /api/auth/logout { proxy_pass http://virtualoffice_jax_api; }
    location = /api/auth/me { proxy_pass http://virtualoffice_jax_api; }
    location = /api/auth/me/password { proxy_pass http://virtualoffice_jax_api; }
    location = /api/auth/forgot-password { proxy_pass http://virtualoffice_jax_api; }
    location = /api/auth/reset-password { proxy_pass http://virtualoffice_jax_api; }

    location = /api/auth/mfa/status { proxy_pass http://virtualoffice_jax_api; }
    location = /api/auth/mfa/login/verify { proxy_pass http://virtualoffice_jax_api; }
    location = /api/auth/mfa/enrollment/start { proxy_pass http://virtualoffice_jax_api; }
    location = /api/auth/mfa/enrollment/confirm { proxy_pass http://virtualoffice_jax_api; }
    location = /api/auth/mfa/step-up { proxy_pass http://virtualoffice_jax_api; }
    location = /api/auth/mfa/step-up/verify { proxy_pass http://virtualoffice_jax_api; }
    location = /api/auth/mfa/recover { proxy_pass http://virtualoffice_jax_api; }
    location = /api/auth/mfa/recovery/enrollment/start { proxy_pass http://virtualoffice_jax_api; }
    location = /api/auth/mfa/reenrollment/start { proxy_pass http://virtualoffice_jax_api; }
    location = /api/auth/mfa/recovery-codes/regenerate { proxy_pass http://virtualoffice_jax_api; }
    location = /api/auth/mfa/disable { proxy_pass http://virtualoffice_jax_api; }

    # Login, reset and the initial SPA shell fetch this public, bounded display
    # configuration. It has no write contract; deny every other method before
    # the request reaches JAX.
    location = /api/apariencia {
        if ($request_method != GET) { return 404; }
        proxy_pass http://virtualoffice_jax_api;
    }

    # The Office API is deliberately one bounded namespace.  Both forms are
    # listed: FastAPI returns the authoritative result for the bare namespace,
    # while all children remain available to the SPA.
    location = /api/virtual-office { proxy_pass http://virtualoffice_jax_api; }
    location ^~ /api/virtual-office/ { proxy_pass http://virtualoffice_jax_api; }

    # Avoid using SPA fallback for denied API paths: it turns a blocked API
    # request into a 200 HTML response and leaks a routing oracle.
    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location = /ws { return 404; }
    location ^~ /ws/ { return 404; }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files /index.html =404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
